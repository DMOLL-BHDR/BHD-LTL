  return modalShell('Data & integration status', `
  <div class="note amber" style="margin-bottom:12px"><b>This is a demonstration.</b> All customers, facilities, carriers, people, loads, documents and charges are synthetic. No Sunnybrook, carrier or USPS system is connected.</div>
  <h3>Demonstrated in this build</h3><ul class="small" style="padding-left:18px"><li>Network, facility, shipment, exception, insight and opportunity views over one synthetic dataset (${BASE.shipments.length} loads, ${FACILITIES.length} facilities, ${CARRIERS.length} carriers, Sep 1 – Nov 6, 2026)</li><li>Replaceable data adapter (<span class="mono">DemoAdapter</span>) with an explicit customer-field allowlist and tenant mapping (${CUSTOMER.sunnybrookCustomerId} → ${CUSTOMER.id})</li><li>Control-tower notes, assignments, reviews and resolutions stored against stable load IDs in browser storage</li><li>Role views that illustrate permission rules (not authentication)</li></ul>
  <h3>Not verified — needed for production</h3><ul class="small" style="padding-left:18px"><li>USPS control tower source code (repository not available in this session) — authentication, Sunnybrook adapter, documents, roles, exceptions and audit trail were not inspected or reused</li><li>Confirmed Sunnybrook endpoints and fields for loads, stops, PROs, tracking events and documents; pagination, rate limits and change feeds</li><li>Whether Sunnybrook supports event updates or incremental refresh (the vendor roadmap describes a nightly sync; a nightly snapshot must not be labeled live)</li><li>Server-side identity, customer and facility scoping in queries, exports and documents</li><li>Shared backend for conversation, exception workflow and review items</li><li>Customer charge source (invoice vs. estimate) and the approved writeback workflow, if any</li></ul>
  <h3>Sync</h3><p class="small">Mode: ${esc(BASE.sync.cadence)} · last successful snapshot ${fmtDT(BASE.sync.lastSuccess)}</p>`, 'About');
}

/* ---------- Events ---------- */
function setFilter(mut, opts = {}) {
  mut(F);
  if (opts.view !== false) UI.view = 'custom';
  UI.limit = 60;
  if (opts.full) render({ keepScroll: opts.keepScroll }); else renderMain();
}
function applyQuick(q, extra = {}) {
  F.quick = q || null; Object.assign(F, extra); UI.view = q === 'delToday' ? 'today' : q === 'late' ? 'late' : q === 'stale' ? 'stale' : q === 'exceptions' ? 'exceptions' : 'custom';
  if (UI.page === 'shipments') render(); else go('shipments');
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (UI.pop && !ev.target.closest('.popover') && !(t && t.dataset.act === 'pop')) { UI.pop = null; render({ keepScroll: true }); if (!t) return; }
  if (!t) return;
  const a = t.dataset.act, d = t.dataset;
  switch (a) {
    case 'pop': ev.stopPropagation(); UI.pop = UI.pop === d.pop ? null : d.pop; render({ keepScroll: true }); break;
    case 'goto': UI.pop = null; if (d.page === 'facility') go('facility', d.param); else go(d.page); break;
    case 'quick': applyQuick(d.q); break;
    case 'fac-q': F.facility = d.id; F.side = d.side || 'any'; F.lane = null; applyQuick(d.q || null); break;
    case 'fac-ex': F.facility = d.id; F.side = 'any'; UI.exTab = 'open'; if (UI.page === 'exceptions') render(); else go('exceptions'); break;
    case 'fac-filter': F.facility = d.id; F.side = 'any'; toast('Whole app filtered to ' + locName(d.id)); go('overview'); break;
    case 'dir': setFilter(f => { const s = new Set(f.dirs); s.has(d.dir) ? s.delete(d.dir) : s.add(d.dir); if (!s.size) s.add(d.dir); f.dirs = ['inbound', 'outbound', 'interfacility'].filter(x => s.has(x)); }, { full: true, keepScroll: true }); break;
    case 'clear-chip': setFilter(f => { const df = defaultFilters(); if (d.k === 'facility') { f.facility = role().facilities === 'all' ? 'all' : role().facilities[0]; f.side = 'any'; } else if (d.k === 'range') { f.range = 'period'; f.from = df.from; f.to = df.to; } else if (d.k === 'quick') { f.quick = null; IDSET = new Set(); } else f[d.k] = df[d.k]; }, { full: true, keepScroll: true }); break;
    case 'reset-filters': F = defaultFilters(); if (role().facilities !== 'all') F.facility = role().facilities[0]; IDSET = new Set(); UI.view = 'all'; render(); toast('Filters reset'); break;
    case 'lane-go': F.lane = d.key; applyQuick(null); break;
    case 'ftoggle': UI.filtersOpen = !UI.filtersOpen; render({ keepScroll: true }); break;
    case 'open-ship': ev.stopPropagation(); lastFocus = document.activeElement; MODAL = null; openDrawer('ship', d.id); break;
    case 'open-ex': ev.stopPropagation(); lastFocus = document.activeElement; MODAL = null; UI.pop = null; openDrawer('ex', d.id); break;
    case 'close-drawer': closeDrawer(); break;
    case 'overlay': if (ev.target === t) closeDrawer(); break;
    case 'sort': UI.sort = { key: d.k, dir: UI.sort.key === d.k && UI.sort.dir === 'desc' ? 'asc' : 'desc' }; renderMain(); break;
    case 'more': UI.limit += 100; renderMain(); break;
    case 'view': {
      UI.view = d.v; F.quick = null; F.status = 'all'; IDSET = new Set();
      if (d.v.startsWith('saved:')) { const v = LAYER.savedViews[+d.v.slice(6)]; if (v) { F = Object.assign(defaultFilters(), JSON.parse(JSON.stringify(v.filters))); if (!allowedFacility(F.facility) && F.facility !== 'all' || (F.facility === 'all' && role().facilities !== 'all')) F.facility = role().facilities === 'all' ? 'all' : role().facilities[0]; UI.cols = v.cols.slice(); UI.sort = Object.assign({}, v.sort); } }
      else BUILTIN_VIEWS[d.v].apply();
      UI.view = d.v; render({ keepScroll: true }); break;
    }
    case 'save-view': {
      const name = (prompt('Name this view (saved in this browser):', 'My view') || '').trim().slice(0, 40);
      if (!name) break;
      LAYER.savedViews.push({ name, filters: JSON.parse(JSON.stringify(F)), cols: UI.cols.slice(), sort: Object.assign({}, UI.sort) }); persist();
      UI.view = 'saved:' + (LAYER.savedViews.length - 1); render({ keepScroll: true }); toast('View saved: ' + name); break;
    }
    case 'cols-default': UI.cols = COLS.filter(c => c.def).map(c => c.k); render({ keepScroll: true }); break;
    case 'export': exportCSV(); break;
    case 'ex-tab': UI.exTab = d.v; if (UI.page !== 'exceptions') go('exceptions'); else renderMain(); break;
    case 'escalate': {
      const e = api.exception(d.id); if (!e || !role().canEscalate) break;
      e.severity = 'high'; e.history.push({ at: demoNow(), by: role().user, action: 'Escalated', detail: 'Severity raised to high.', vis: 'customer', local: true }); persist(); render({ keepScroll: true }); toast('Exception escalated'); break;
    }
    case 'review': {
      const o = computeOpportunities().find(x => x.id === d.id); if (!o) break;
      const rv = { id: 'RV-' + (1001 + LAYER.reviews.length), oppId: o.id, title: o.title, loads: o.ships.map(s => s.id), at: demoNow(), by: role().user, owner: o.owner, status: 'submitted' };
      LAYER.reviews.push(rv); persist(); render({ keepScroll: true }); toast(`${rv.id} sent to BHD for review — no freight was booked or changed`); break;
    }
    case 'opp-ships': IDSET = new Set(d.ids.split(',')); applyQuick('ids'); break;
    case 'doc': MODAL = docModal(d.id, d.t); lastFocus = document.activeElement; renderDrawer(); break;
    case 'defs': UI.pop = null; MODAL = defsModal; render({ keepScroll: true }); break;
    case 'about': UI.pop = null; MODAL = aboutModal; render({ keepScroll: true }); break;
    case 'close-modal': MODAL = null; renderDrawer(); if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); break;
    case 'modal-bg': if (ev.target === t) { MODAL = null; renderDrawer(); } break;
    case 'toggle-sync': LAYER.syncError = !LAYER.syncError; UI.pop = null; persist(); render({ keepScroll: true }); toast(LAYER.syncError ? 'Simulated sync failure — data shown is the last good snapshot' : 'Sync simulation cleared'); break;
    case 'reset': if (confirm('Reset the demo? This clears notes, assignments, resolutions, saved views and review requests saved in this browser.')) { storage.clear(); LAYER = freshLayer(); invalidate(); F = defaultFilters(); UI.pop = null; MODAL = null; IDSET = new Set(); UI.cols = null; UI.view = 'all'; location.hash = '#/overview'; render(); toast('Demo reset to the original synthetic snapshot'); } break;
  }
});
let demoTick = 0;
const demoNow = () => DEMO.asOf + (++demoTick) * 60e3; // demo clock is fixed; local actions are stamped just after it, in order
document.addEventListener('change', ev => {
  const t = ev.target, k = t.dataset.change; if (!k) return;
  switch (k) {
    case 'facility': setFilter(f => { f.facility = t.value; f.side = 'any'; f.lane = null; }, { full: true }); break;
    case 'range': setFilter(f => { f.range = t.value; if (RANGES[t.value].from) { f.from = RANGES[t.value].from; f.to = RANGES[t.value].to; } }, { full: true }); break;
    case 'from': setFilter(f => { f.from = t.value || DEMO.periodStart; if (f.from > f.to) f.to = f.from; }, { full: true }); break;
    case 'to': setFilter(f => { f.to = t.value || DEMO.periodEnd; if (f.to < f.from) f.from = f.to; }, { full: true }); break;
    case 'carrier': setFilter(f => { f.carrier = t.value; }, { full: true }); break;
    case 'status': setFilter(f => { f.status = t.value; }, { full: true }); break;
    case 'role': {
      LAYER.role = t.value; invalidate(); persist(); UI.pop = null;
      const r = role(); if (r.facilities !== 'all') F.facility = r.facilities[0]; else if (!FACILITIES.some(f => f.id === F.facility)) F.facility = 'all';
      F.lane = null; UI.cols = null;
      render(); toast('Demo view: ' + r.label + ' — illustration only, not authentication'); break;
    }
    case 'col': { const s = new Set(UI.cols); t.checked ? s.add(t.value) : s.delete(t.value); UI.cols = COLS.filter(c => s.has(c.k)).map(c => c.k); renderMain(); break; }
    case 'cmp': UI.cmp[t.dataset.k] = t.value; renderMain(); break;
    case 'ex-type': UI.exType = t.value; renderMain(); break;
    case 'ex-sev': UI.exSev = t.value; renderMain(); break;
  }
});
let searchT;
document.addEventListener('input', ev => {
  if (ev.target.dataset.input !== 'search') return;
  clearTimeout(searchT);
  const v = ev.target.value;
  searchT = setTimeout(() => { F.search = v.trim(); UI.limit = 60; if (F.search && UI.page !== 'shipments' && UI.page !== 'exceptions' && UI.page !== 'overview') { } renderMain(); }, 160);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    if (MODAL) { MODAL = null; renderDrawer(); return; }
    if (UI.drawer) { closeDrawer(); return; }
    if (UI.pop) { UI.pop = null; render({ keepScroll: true }); return; }
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('tr.clickable')) { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  if (ev.key === 'Enter' && ev.target.id === 'f-q') { ev.preventDefault(); clearTimeout(searchT); F.search = ev.target.value.trim(); if (UI.page !== 'shipments' && F.search) go('shipments'); else renderMain(); }
  // trap focus in drawer / modal
  if (ev.key === 'Tab') {
    const box = document.querySelector('#modal .modal') || document.querySelector('#overlay .drawer');
    if (!box) return;
    const f = [...box.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea,[tabindex="0"],summary,a[href]')].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    if (ev.shiftKey && document.activeElement === f[0]) { ev.preventDefault(); f[f.length - 1].focus(); }
    else if (!ev.shiftKey && document.activeElement === f[f.length - 1]) { ev.preventDefault(); f[0].focus(); }
  }
});
document.addEventListener('submit', ev => {
  const form = ev.target, k = form.dataset.form; if (!k) return;
  ev.preventDefault();
  const fd = new FormData(form), r = role();
  if (k === 'comment') {
    const text = (fd.get('text') || '').trim(); if (!text) return;
    const vis = r.internal ? fd.get('vis') : 'customer';
    LAYER.comments.push({ id: 'c' + Date.now(), loadId: form.dataset.id, at: demoNow(), by: r.user, org: r.bhd ? 'BHD' : 'Northfield', vis, text, local: true });
    persist(); renderDrawer(); toast(vis === 'internal' ? 'Internal note added (BHD only)' : 'Message posted');
  }
  if (k === 'ex') {
    const e = api.exception(form.dataset.id); if (!e || !r.canAssign) return;
    const owner = fd.get('owner') || null, status = fd.get('status'), next = (fd.get('next') || '').trim(), due = fd.get('due');
    const changes = [];
    const at = demoNow();
    if (owner !== e.owner) { changes.push(owner ? `Assigned to ${owner}` : 'Unassigned'); e.owner = owner; e.history.push({ at, by: r.user, action: owner ? 'Assigned' : 'Unassigned', detail: owner ? `Assigned to ${owner}.` : 'Owner removed.', vis: 'customer', local: true }); }
    let st = status; if (owner && e.status === 'new' && st === 'new') st = 'assigned';
    if (st !== e.status) { changes.push('status ' + EX_STATUS_LABEL[st]); e.history.push({ at, by: r.user, action: 'Status changed', detail: `${EX_STATUS_LABEL[e.status]} → ${EX_STATUS_LABEL[st]}`, vis: 'customer', local: true }); e.status = st; }
    if (next && next !== e.nextAction) { changes.push('next action'); e.history.push({ at, by: r.user, action: 'Next action updated', detail: next, vis: 'customer', local: true }); e.nextAction = next; }
    if (due) { e.dueAt = DEMO.asOf + (+due) * H; changes.push('due time'); e.history.push({ at, by: r.user, action: 'Due time set', detail: 'Due ' + fmtDT(e.dueAt), vis: 'customer', local: true }); }
    persist(); render({ keepScroll: true }); toast(changes.length ? 'Saved: ' + changes.join(', ') : 'No changes');
  }
  if (k === 'exnote') {
    const e = api.exception(form.dataset.id); if (!e) return;
    const text = (fd.get('text') || '').trim(); if (!text) return;
    const vis = r.internal ? fd.get('vis') : 'customer';
    e.history.push({ at: demoNow(), by: r.user, action: vis === 'internal' ? 'Internal note' : (r.bhd ? 'Note' : 'Customer note'), detail: text, vis, local: true });
    persist(); renderDrawer(); toast('Note added');
  }
  if (k === 'resolve') {
    const e = api.exception(form.dataset.id); if (!e || !r.canResolve) return;
    const reason = fd.get('reason'); if (!reason) return;
    const note = (fd.get('note') || '').trim();
    const at = demoNow();
    e.status = 'resolved'; e.resolvedAt = at; e.resolution = reason + (note ? ' — ' + note : ''); if (!e.owner) e.owner = r.user;
    e.history.push({ at, by: r.user, action: 'Resolved', detail: e.resolution + ' (carrier status in Sunnybrook unchanged)', vis: 'customer', local: true });
    persist(); render({ keepScroll: true }); toast('Exception resolved — shipment status unchanged');
  }
});
window.addEventListener('hashchange', () => {
  const prevPage = UI.page, prevParam = UI.param;
  parseHash();
  UI.pop = null;
  if (UI.page !== prevPage || UI.param !== prevParam) { MODAL = null; render(); window.scrollTo(0, 0); const m = document.getElementById('main'); if (m && !UI.drawer) m.focus({ preventScroll: true }); }
  else { renderDrawer(); if (!UI.drawer && lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
});

/* ---------- Start ---------- */
function start() {
  parseHash();
  render(); // loading skeleton
  setTimeout(() => {
    try {
      initData();
      if (role().facilities !== 'all') F.facility = role().facilities[0];
      UI.loading = false;
      render();
    } catch (err) {
      console.error(err);
      document.getElementById('app').innerHTML = headerSkeleton().replace(/<main[\s\S]*<\/main>/, '') + `<main class="content"><div class="banner red" role="alert">${ic('alert')}<div><b>The control tower could not load its data.</b> ${esc(err.message)}. Try Reset demo or reload the page.</div></div></main>`;
    }
  }, 350);
}
document.addEventListener('DOMContentLoaded', start);

</script></body></html>
