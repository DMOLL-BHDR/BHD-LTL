<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B1F3A">
<title>BHD LTL Control Center</title>
<meta name="description" content="BHD LTL Control Center — Your facilities. Your freight. One network. Demonstration build with synthetic data. Powered by Backhaul Direct.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* BHD LTL Control Center — Food It Forward design language (BHD product family) */
:root{--navy:#0B1F3A;--navy2:#12294A;--navy3:#1C3A62;--lime:#BCD84A;--lime-ink:#1F2A06;--lime-bg:#F3F8DF;--bg:#F2F4F7;--ink:#14202F;--muted:#627083;--line:#DFE4EB;--line2:#ECEFF3;--teal:#0D7F74;--amber:#A86300;--red:#BC2F28;--soft:#F8F9FB;--teal-bg:#E2F3F0;--amber-bg:#FCF0DA;--red-bg:#FBE5E3;--blue-bg:#E4EAF3;--focus:#3B82F6}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:14px/1.5 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{letter-spacing:-.01em;line-height:1.3}h1{font-size:23px}h2{font-size:16px}h3{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy3)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;z-index:100}.skip:focus{left:12px;top:12px;background:#fff;padding:10px;border-radius:6px}
.icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.teal-text{color:var(--teal)}.amber-text{color:var(--amber)}.red-text{color:var(--red)}

/* ---------- Header ---------- */
.site-header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30}
.header-inner{max-width:1500px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:22px;min-height:74px}
.brand{text-decoration:none;border:0;padding:0;background:transparent;display:flex;align-items:center;gap:14px;color:#fff;flex-shrink:0;text-align:left}
.brand img{display:block;width:150px;height:auto;max-height:44px}
.brand .logo-fallback{font-weight:700;letter-spacing:.06em;font-size:13px}
.brand-divider{height:34px;width:1px;background:#54708C}
.brand-title{font-size:13px;font-weight:600;line-height:1.35;letter-spacing:.01em}
.mainnav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.mainnav::-webkit-scrollbar{display:none}
.mainnav a{border-radius:5px;color:#C3CFE0;padding:10px 12px;white-space:nowrap;font-size:13px;font-weight:500;text-decoration:none;transition:background .15s,color .15s}
.mainnav a:hover{background:var(--navy2);color:#fff}
.mainnav a[aria-current=page]{background:var(--navy3);color:#fff;box-shadow:inset 0 -2px var(--lime)}
.header-tools{display:flex;align-items:center;gap:9px}
.header-btn{display:flex;align-items:center;gap:6px;border:1px solid #24446E;background:transparent;color:#DCE5F2;font-size:12px;padding:7px 9px;border-radius:6px;position:relative}
.header-btn:hover{background:var(--navy2)}
.header-btn b.count{position:absolute;right:-7px;top:-8px;border-radius:12px;padding:0 5px;font-size:10px;background:var(--lime);color:var(--lime-ink);line-height:16px}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--navy2);border:1px solid #24446E;border-radius:6px;padding:4px 10px 4px 4px;color:#fff;font-size:12px;text-align:left}
.user-chip .av{width:28px;height:28px;border-radius:5px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-weight:700;font-size:11px}
.user-chip small{display:block;color:#A9BBD3;font-size:10.5px;line-height:1.2}
.user-chip strong{display:block;font-size:12px;line-height:1.25;font-weight:600}
.demo-strip{background:#0E2645;border-top:1px solid #1A3459;color:#A9BBD3;text-align:center;font-size:11px;padding:4px 14px}
.demo-strip b{color:var(--lime);font-weight:600}

/* ---------- Popovers ---------- */
.popover{position:absolute;right:0;top:calc(100% + 8px);background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px #0B1F3A26;width:340px;z-index:40;padding:6px;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.popover h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px 6px}
.pop-item{display:flex;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:5px;font-size:12px;align-items:flex-start}
.pop-item:hover{background:var(--soft)}
.pop-item small{display:block;color:var(--muted);font-size:11px}
.pop-sep{height:1px;background:var(--line2);margin:5px 0}
.pop-field{padding:8px 10px}
.pop-field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}

/* ---------- Filter bar ---------- */
.filterbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:74px;z-index:20}
.btn.ftoggle{display:none}
.filter-inner{max-width:1500px;margin:auto;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.cust{display:flex;align-items:center;gap:10px;padding-right:12px;border-right:1px solid var(--line);margin-right:2px}
.cust .mark{width:30px;height:30px;border-radius:6px;background:var(--navy);color:var(--lime);display:grid;place-items:center;font-weight:700;font-size:11px}
.cust strong{display:block;font-size:13px;line-height:1.2}
.cust small{display:block;color:var(--muted);font-size:11px}
.fctl{display:flex;flex-direction:column;gap:2px}
.fctl label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.select,.input{border:1px solid var(--line);border-radius:6px;background:#fff;padding:6px 9px;font-size:12.5px;min-height:32px;color:var(--ink)}
.select:hover,.input:hover{border-color:#C5CDD8}
.input{width:100%}
textarea.input{min-height:76px;resize:vertical;line-height:1.55}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search .icon{position:absolute;left:10px;top:8px;color:var(--muted)}
.search input{padding-left:32px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:12px;color:#344255;border-right:1px solid var(--line2);min-height:30px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.seg button:hover:not([aria-pressed=true]){background:var(--soft)}
.fresh{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.chips-row{max-width:1500px;margin:auto;padding:0 24px 9px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips-row:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--lime-bg);border:1px solid #D3E59A;border-radius:20px;padding:2px 4px 2px 10px;font-size:11.5px;color:#344255}
.fchip button{border:0;background:transparent;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#55657A}
.fchip button:hover{background:#E4F0B8}

/* ---------- Layout ---------- */
.content{max-width:1500px;margin:auto;padding:24px 24px 90px;outline:none}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head p{color:var(--muted);font-size:13.5px;max-width:780px;margin-top:5px}
.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px #1018280A}
.pad{padding:18px}
.sec-h{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--muted);margin:28px 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec-h .note-inline{text-transform:none;letter-spacing:0;font-weight:400}
.sec-h .right{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.demo-tag{font-size:10px;letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:#E9EDF3;color:#55657A;text-transform:uppercase;font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.panel-head h2{font-size:15px}
.panel-head small{color:var(--muted);font-size:11.5px}

/* ---------- Hero ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center;padding:24px 26px;margin-bottom:18px}
.hero h1{font-size:26px;color:var(--navy);letter-spacing:-.02em;margin:6px 0 8px}
.hero h1 em{font-style:normal;box-shadow:inset 0 -.32em #E4F0B8}
.hero p{color:#344255;font-size:14px;max-width:620px}
.priorities{display:flex;flex-direction:column;gap:7px}
.prio{display:flex;align-items:center;gap:11px;border:1px solid var(--line2);border-radius:6px;padding:9px 12px;background:#fff;text-align:left;font-size:12.5px;transition:border-color .15s,background .15s}
.prio:hover{background:var(--soft);border-color:var(--line)}
.prio .tile{width:30px;height:30px;border-radius:6px;background:var(--navy);color:var(--lime);display:grid;place-items:center;flex:none}
.prio.hot{background:#FBFDF4;border-color:#D3E59A}
.prio.hot .tile{background:var(--lime);color:var(--navy)}
.prio strong{display:block;font-size:13px}
.prio small{display:block;color:var(--muted);font-size:11.5px}

/* ---------- KPI strip ---------- */
.snapshot{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden}
.snapshot-cell{border:0;border-right:1px solid var(--line2);background:transparent;padding:13px 16px;text-align:left;display:block;transition:background .15s}
.snapshot-cell:last-child{border-right:0}
.snapshot-cell:hover{background:var(--soft)}
.snapshot-cell span,.snapshot-cell small{display:block;color:var(--muted);font-size:11.5px}
.snapshot-cell strong{display:block;font-size:21px;letter-spacing:-.01em;margin:2px 0;font-variant-numeric:tabular-nums}
.snapshot-cell .go{float:right;color:#9AA6B6}

/* ---------- Badges, chips ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;line-height:18px;white-space:nowrap;background:#EEF1F4;color:#566375}
.badge:before{content:'';width:5px;height:5px;background:currentColor;border-radius:50%}
.badge.teal{color:var(--teal);background:var(--teal-bg)}
.badge.amber{color:var(--amber);background:var(--amber-bg)}
.badge.red{color:var(--red);background:var(--red-bg)}
.badge.blue{color:var(--navy3);background:var(--blue-bg)}
.badge.lime{color:#4E6012;background:var(--lime-bg)}
.badge.plain:before{display:none}
.sev{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.sev i{width:8px;height:8px;border-radius:2px;display:inline-block}
.sev.high{color:var(--red)}.sev.high i{background:var(--red)}
.sev.medium{color:var(--amber)}.sev.medium i{background:var(--amber)}
.sev.low{color:#566375}.sev.low i{background:#97A3B3}
.route-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.route-chips b{background:var(--soft);border:1px solid var(--line2);border-radius:3px;padding:1px 6px;font-weight:500;white-space:nowrap}
.route-chips b:first-child{background:var(--lime-bg);border-color:#DCE9A8}
.route-chips .arrow{color:#9AA6B6}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:13px;font-weight:600;min-height:34px;padding:6px 13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--soft);border-color:#C5CDD8}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.btn.primary:hover{background:#AAC63A;border-color:#AAC63A}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.dark:hover{background:var(--navy3)}
.btn.sm{font-size:12px;padding:4px 9px;min-height:28px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--navy3);padding:3px 6px;min-height:26px}
.btn.ghost:hover{background:var(--soft)}
.btn.link{border:0;background:transparent;color:var(--navy3);padding:0;min-height:0;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkish{border:0;background:transparent;padding:0;color:var(--navy3);font-weight:600;text-align:left;font-size:inherit}
.linkish:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- Overview map ---------- */
.ov-grid{margin-top:16px}
.map-card{display:flex;flex-direction:column;min-width:0}
.map-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.map-wrap{position:relative;flex:1;min-height:440px;background:linear-gradient(#FBFCFD,#F6F8FA);border-bottom:1px solid var(--line2)}
.map-wrap svg{display:block;width:100%;height:100%}
.map-legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 18px;font-size:11.5px;color:var(--muted);align-items:center}
.map-legend span{display:inline-flex;align-items:center;gap:6px}
.lg-fac{width:12px;height:12px;background:var(--navy);border:2px solid var(--lime);border-radius:3px}
.lg-ext{width:10px;height:10px;background:#fff;border:2px solid #8191A5;border-radius:50%}
.lg-term{width:9px;height:9px;background:#fff;border:2px solid var(--navy3);transform:rotate(45deg)}
.lg-lane{width:22px;height:3px;background:#7C8FA8;border-radius:2px}
.lg-lane.prob{background:var(--red)}
.lg-lane.watch{background:var(--amber)}
.lg-rep{width:10px;height:10px;border-radius:50%;background:#fff;border:2px dashed var(--navy3)}
.lane{cursor:pointer;transition:opacity .15s}
.lane path.hit{stroke:transparent;fill:none}
.lane:hover path.vis,.lane:focus path.vis{filter:drop-shadow(0 0 2px #0B1F3A55)}
.lane.dim{opacity:.18}
.lane:focus{outline:none}
.lane:focus-visible path.vis{stroke-dasharray:none;filter:drop-shadow(0 0 3px #3B82F6)}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible .ring{stroke:var(--focus);stroke-width:3}
.node.dim{opacity:.35}
.map-caption{position:absolute;left:12px;bottom:10px;font-size:10.5px;color:var(--muted);background:#ffffffD9;padding:3px 8px;border-radius:4px;border:1px solid var(--line2)}
.map-tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;font-size:11.5px;border-radius:6px;padding:8px 10px;box-shadow:0 6px 20px #0B1F3A40;max-width:260px;z-index:5;opacity:0;transition:opacity .1s;line-height:1.45}
.map-tip b{color:var(--lime);font-weight:600}
.map-tip.on{opacity:1}
.sel-banner{display:flex;align-items:center;gap:10px;padding:9px 18px;background:var(--lime-bg);border-bottom:1px solid #DCE9A8;font-size:12.5px;flex-wrap:wrap}

/* ---------- Attention list ---------- */
.attn{display:flex;flex-direction:column}
.attn-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.attn-list .attn-item{border-right:1px solid var(--line2)}
.attn-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);background:#fff;padding:12px 16px;transition:background .15s}
.attn-item:hover{background:var(--soft)}
.attn-item:last-child{border-bottom:0}
.attn-item .top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.attn-item .issue{font-weight:600;font-size:13px;margin:4px 0 2px}
.attn-item .meta{font-size:11.5px;color:var(--muted)}
.attn-item .next{font-size:12px;margin-top:5px;color:#344255}
.attn-item .next b{font-weight:600}

/* ---------- Facility cards ---------- */
.fac-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.fac-card{padding:15px 16px;display:flex;flex-direction:column;gap:10px;text-align:left;transition:border-color .15s,box-shadow .15s}
.fac-card:hover{border-color:#B9C3D0;box-shadow:0 2px 6px #10182812}
.fac-card.on{border-color:#C9DD7A;background:#FDFEF8}
.fac-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fac-top h3{font-size:14.5px}
.fac-top small{display:block;color:var(--muted);font-size:11.5px}
.code{font-size:10.5px;font-weight:700;letter-spacing:.06em;background:var(--navy);color:var(--lime);padding:2px 6px;border-radius:4px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line2);border-radius:5px}
.facts>*{padding:7px 9px;border-right:1px solid var(--line2);text-align:left;border-top:0;border-bottom:0;border-left:0;background:transparent}
.facts>*:last-child{border-right:0}
.facts small{display:block;color:var(--muted);font-size:10.5px}
.facts strong{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.facts button:hover{background:var(--soft)}
.fac-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:8px;flex-wrap:wrap}
.meter{height:6px;background:#E5E9EF;border-radius:4px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--teal);border-radius:4px}

/* ---------- Tables ---------- */
.table-wrap{overflow:auto;border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--soft);font-size:11px;color:var(--muted);padding:9px 12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
th button{border:0;background:transparent;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;padding:0;display:inline-flex;gap:4px;align-items:center}
th button:hover{color:var(--ink)}
th[aria-sort=ascending] button,th[aria-sort=descending] button{color:var(--navy)}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
td small{display:block;color:var(--muted);font-size:11px}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#F6F9FC}
tr.clickable:focus-within td{background:#F3F7FC}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.table-id{color:var(--navy3);font-weight:600;white-space:nowrap}
.nowrap{white-space:nowrap}
.table-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12px;color:var(--muted);gap:10px;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line2)}
.views{display:flex;gap:5px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;font-size:12px;color:#344255}
.tab:hover{background:var(--soft)}
.tab[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

/* ---------- Drawer / modal ---------- */
.overlay{position:fixed;inset:0;background:#0B1F3A66;z-index:50;display:flex;justify-content:flex-end;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{background:#fff;width:min(760px,100%);height:100%;overflow-y:auto;box-shadow:-10px 0 30px #0B1F3A33;animation:slide .2s ease-out;display:flex;flex-direction:column}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.dialog-head{padding:18px 24px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:2}

.dialog-head h2{font-size:20px;margin-top:2px}

.close{border:1px solid #405675;background:var(--navy2);color:#fff;border-radius:5px;width:34px;height:34px;display:grid;place-items:center;flex:none}

.modal-wrap{position:fixed;inset:0;background:#0B1F3A66;z-index:60;display:grid;place-items:center;padding:20px;animation:fade .15s}
.modal{background:#fff;border-radius:7px;width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px #0B1F3A44}
.details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.details>div{padding:9px 12px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.details span{display:block;font-size:11px;color:var(--muted)}
.details strong{display:block;font-size:13px;font-weight:600}
.details small{display:block;font-size:11px;color:var(--muted)}
.commit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.commit>div{border:1px solid var(--line2);border-radius:6px;padding:11px 13px}
.commit .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.commit dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:6px;font-size:12.5px}
.commit dt{color:var(--muted)}
.commit dd{margin:0;font-weight:500}

/* Milestone stepper */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin:4px 0 2px}
.step{position:relative;text-align:center;font-size:11px;color:var(--muted);padding-top:22px}
.step:before{content:'';position:absolute;top:8px;left:0;right:0;height:3px;background:#E5E9EF}
.step:first-child:before{left:50%}.step:last-child:before{right:50%}
.step i{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid #C5CDD8;z-index:1}
.step.done:before{background:var(--teal)}
.step.done i{background:var(--teal);border-color:var(--teal)}
.step.cur i{background:#fff;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-bg)}
.step.cur{color:var(--ink);font-weight:600}
.step.done{color:#344255}

.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px;display:flex;flex-direction:column;gap:12px}
.tl{position:relative;font-size:12.5px}
.tl:before{content:'';position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #8191A5}
.tl.teal:before{border-color:var(--teal);background:var(--teal)}
.tl.amber:before{border-color:var(--amber)}
.tl.red:before{border-color:var(--red)}
.tl.internal{background:#FFF8EA;border:1px dashed #E7C98F;border-radius:5px;padding:7px 9px}
.tl .raw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#55657A;background:var(--soft);border:1px solid var(--line2);border-radius:4px;padding:2px 6px;display:inline-block;margin-top:3px;overflow-wrap:anywhere}

.note{background:var(--soft);border-radius:5px;padding:10px 12px;font-size:12px;color:#55657A}
.note.amber{background:var(--amber-bg);color:#7A4A00}
.note.red{background:var(--red-bg);color:#8E2620}
.note.blue{background:#EAF0F7;color:var(--navy3)}
.note.lime{background:var(--lime-bg);color:#3D4C0E}
.note b{font-weight:600}

.docs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.doc.missing .dtile,.doc.pending .dtile{background:#EEF1F4;color:#97A3B3}
.doc strong{display:block}
.doc small{display:block;color:var(--muted);font-size:11px}
button.doc:hover{background:var(--soft);border-color:var(--line)}

.comments{display:flex;flex-direction:column;gap:10px}
.cmt{border:1px solid var(--line2);border-radius:6px;padding:10px 12px;font-size:12.5px;background:#fff}
.cmt.internal{background:#FFF8EA;border:1px dashed #E7C98F}
.cmt header{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px;flex-wrap:wrap}
.cmt header small{color:var(--muted)}
.composer{border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:10px;background:var(--soft)}
.composer .row{margin-top:8px}

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600}
.field small{color:var(--muted);font-size:11px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

.bar-row{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;font-size:12px;padding:5px 0}
.bar-row .track{height:12px;background:#EEF1F4;border-radius:3px;overflow:hidden;position:relative}
.bar-row .track span{display:block;height:100%;border-radius:3px}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .val{text-align:right;font-variant-numeric:tabular-nums}
.stack-legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;margin-bottom:6px}
.stack-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.kpi-def{font-size:11.5px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}

.opp li{margin:2px 0}

.skeleton{background:linear-gradient(90deg,#EEF1F4 0%,#F7F8FA 50%,#EEF1F4 100%);background-size:200% 100%;animation:sk 1.1s infinite;border-radius:6px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.pill-fresh{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;white-space:nowrap}

.pill-fresh.stale{color:var(--red);background:var(--red-bg)}
.pill-fresh.unavailable{color:#566375;background:#EEF1F4}
.pill-fresh.demo{color:#4E6012;background:var(--lime-bg)}
.check{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:4px 0}
.split-note{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--navy3);background:var(--blue-bg);border-radius:3px;padding:0 5px;font-weight:600}
details.def summary{cursor:pointer;color:var(--navy3);font-size:12px;font-weight:500}

  ['F02', 'X03', 5, N], ['F02', 'X08', 4, N], ['F02', 'F01', 4, N], ['F02', 'F04', 3, N],
  ['F03', 'X05', 4, S], ['F03', 'X13', 3, S], ['F03', 'F07', 3, SE],
  ['F04', 'X02', 5, W], ['F04', 'X01', 4, N], ['F04', 'F06', 3, W],
  ['F05', 'X13', 4, S], ['F05', 'X05', 3, S], ['F05', 'F07', 3, SE], ['F05', 'F03', 2, S],
  ['F06', 'X07', 4, W], ['F06', 'X02', 3, W], ['F06', 'F08', 3, W],
  ['F07', 'X04', 5, SE], ['F07', 'X14', 4, SE], ['F07', 'X13', 2, S],
  ['F08', 'X06', 6, W], ['F08', 'X12', 5, W], ['F08', 'X07', 3, W],
  ['X09', 'F01', 4, N], ['X10', 'F02', 4, N], ['X11', 'F04', 4, N], ['X09', 'F03', 2, N], ['X10', 'F05', 2, S], ['X11', 'F06', 3, W],
];

const PEOPLE = {
  bhd: ['Dana Whitfield', 'Marcus Lee', 'Priya Natarajan', 'Sam Okafor'],
  bhdTitle: { 'Dana Whitfield': 'BHD Operations', 'Marcus Lee': 'BHD Operations', 'Priya Natarajan': 'BHD Claims & Billing', 'Sam Okafor': 'BHD Account Manager' },
};

/* ---------- helpers ---------- */
const miles = (a, b) => { const R = 3959, t = Math.PI / 180; const dLat = (b.lat - a.lat) * t, dLon = (b.lon - a.lon) * t; const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLon / 2) ** 2; return Math.round(2 * R * Math.asin(Math.sqrt(x)) * 1.18); };
const round2 = n => Math.round(n * 100) / 100;
const directionOf = (o, d) => LOC[o].kind === 'facility' && LOC[d].kind === 'facility' ? 'interfacility' : LOC[o].kind === 'facility' ? 'outbound' : 'inbound';

const MILESTONES = [
  { key: 'scheduled', label: 'Scheduled' },
  { key: 'picked_up', label: 'Picked up' },
  { key: 'in_transit', label: 'In transit' },
  { key: 'dest_terminal', label: 'At destination terminal' },
  { key: 'out_for_delivery', label: 'Out for delivery' },
  { key: 'delivered', label: 'Delivered' },
];
const MS_INDEX = Object.fromEntries(MILESTONES.map((m, i) => [m.key, i]));
const STATUS_LABEL = { scheduled: 'Scheduled', picked_up: 'Picked up', in_transit: 'In transit', dest_terminal: 'At destination terminal', out_for_delivery: 'Out for delivery', delivered: 'Delivered', partial: 'Partially delivered', unknown: 'Status unknown', cancelled: 'Cancelled' };
const RAW = {
  picked_up: (c, l) => `PU - PICKED UP FROM SHIPPER ${l}`,
  arr_hub: (c, l) => `AR - ARRIVED AT ${c.scac} TERMINAL ${l}`,
  dep_hub: (c, l) => `DP - DEPARTED ${c.scac} TERMINAL ${l}`,
  dest_terminal: (c, l) => `AD - ARRIVED AT DESTINATION TERMINAL ${l}`,
  out_for_delivery: (c, l) => `OD - OUT FOR DELIVERY ${l}`,
  delivered: (c, l, s) => `D1 - DELIVERED ${l} SIGNED BY ${s}`,
};
const SIGNERS = ['J MARTIN', 'K PATEL', 'R DIAZ', 'T NGUYEN', 'A BROOKS', 'M FOSTER', 'L CHEN', 'D WOODS'];

/* ---------- shipment generator ---------- */
function bizDays(from, to) { const out = []; for (let d = from; d <= to; d = addDays(d, 1)) if (isBiz(d)) out.push(d); return out; }
const PICK_DAYS = bizDays('2026-09-01', '2026-11-04');
const laneWeights = LANES.reduce((s, l) => s + l[2], 0);
function pickLane() { let r = rnd() * laneWeights; for (const l of LANES) { r -= l[2]; if (r <= 0) return l; } return LANES[0]; }

let seq = 410150;
function makeShipment(lane, pickDate, opts = {}) {
  const [o, d, , pref] = lane;
  const O = LOC[o], D = LOC[d];
  const carrier = CAR[opts.carrier || (rnd() < 0.72 ? pref[0] : pref[1])];
  const mi = miles(O, D);
  let pallets = opts.pallets ?? (rnd() < 0.62 ? ri(1, 3) : rnd() < 0.75 ? ri(4, 6) : ri(7, 10));
  const service = opts.service || (pallets >= 7 && rnd() < 0.55 ? 'Volume LTL' : rnd() < 0.13 ? 'Guaranteed LTL' : 'Standard LTL');
  const weight = opts.weight ?? Math.round(pallets * ri(420, 1350) / 10) * 10;
  const nmfcClass = opts.cls ?? pick(['50', '55', '60', '65', '70', '77.5', '85', '92.5', '100', '125']);
  const height = ri(36, 72);
  const transit = Math.max(1, Math.ceil(mi / 430));
  const puStartH = pick([8, 9, 10, 12, 13]);
  const pu = { date: pickDate, start: localMs(pickDate, puStartH, 0, O.tz), end: localMs(pickDate, puStartH + 4, 0, O.tz) };
  const dlDate = addBiz(pickDate, transit);
  const dl = { date: dlDate, start: localMs(dlDate, 8, 0, D.tz), end: localMs(dlDate, service === 'Guaranteed LTL' ? 12 : 17, 0, D.tz) };
  seq += ri(3, 29);
  const id = 'SB-' + seq;
  const shp = {
    id, sbLoadId: seq, customerId: CUSTOMER.id,
    origin: o, dest: d, direction: directionOf(o, d), carrier: carrier.id, service, miles: mi,
    bol: 'BOL-' + (700000 + (seq % 99991)), po: 'PO-' + ri(48000, 59999), customerRef: (O.code || 'SUP') + '-' + ri(10000, 99999),
    pallets, weight, cls: nmfcClass, dims: `${pallets} × 48×40×${height} in`, handling: rnd() < 0.15 ? 'Do not stack' : 'Stackable',
    pu, dl, // original commitments: never overwritten
    pros: [], events: [], docs: [], accessorials: [], charges: null, flags: {},
  };
  // Booking accessorials (customer-facing, estimated)
  const acc = [];
  if (['F07', 'X01', 'F06', 'F01'].includes(d) || rnd() < 0.08) acc.push({ code: 'APPT', label: 'Delivery appointment', amt: 35, stage: 'booked' });
  if (['X12', 'X14'].includes(d) && rnd() < 0.6) acc.push({ code: 'LIFT', label: 'Liftgate at delivery', amt: 85, stage: 'booked' });
  if (rnd() < 0.04) acc.push({ code: 'INSD', label: 'Inside delivery', amt: 120, stage: 'booked' });
  shp.accessorials = acc;

  // Outcome
  const missedPickup = opts.missedPickup ?? rnd() < 0.035;
  const delay = opts.delay ?? (rnd() < carrier.otd ? 0 : (rnd() < 0.7 ? 1 : 2)) + (missedPickup ? 1 : 0);
  const actualPuDate = missedPickup ? addBiz(pickDate, 1) : pickDate;
  const actualPu = localMs(actualPuDate, Math.min(puStartH + ri(0, 3), 16), ri(0, 59), O.tz);
  const actualDlDate = addBiz(dlDate, delay);
  const actualDl = localMs(actualDlDate, delay ? ri(9, 16) : ri(8, 15), ri(0, 59), D.tz);
  shp.flags.missedPickup = missedPickup;
  shp._plan = { actualPu, actualDl, actualPuDate, actualDlDate, delay };
  return shp;
}

function eventsFor(shp, { stopAt = Infinity, staleFrom = null } = {}) {
  const c = CAR[shp.carrier], O = LOC[shp.origin], D = LOC[shp.dest], hub = LOC[c.hub];
  const { actualPu, actualDl } = shp._plan;
  const signer = pick(SIGNERS);
  const list = [];
  const add = (ms, at, rawKey, loc, locId) => list.push({ ms, at, raw: RAW[rawKey](c, `${loc}`.toUpperCase(), signer), loc, locId, source: rnd() < 0.6 ? 'Carrier API (demo)' : 'EDI 214 (demo)' });
  const span = actualDl - actualPu;
  add('picked_up', actualPu, 'picked_up', `${O.city}, ${O.st}`, shp.origin);
  if (span > 20 * H) {
    add('in_transit', actualPu + Math.min(6 * H, span * 0.2), 'arr_hub', `${hub.city}, ${hub.st}`, hub.id);
    add('in_transit', actualPu + Math.min(10 * H, span * 0.35), 'dep_hub', `${hub.city}, ${hub.st}`, hub.id);
  }
  add('dest_terminal', actualDl - Math.max(9 * H, Math.min(16 * H, span * 0.3)), 'dest_terminal', `${D.city}, ${D.st} area`, null);
  add('out_for_delivery', actualDl - ri(2, 4) * H, 'out_for_delivery', `${D.city}, ${D.st}`, null);
  add('delivered', actualDl, 'delivered', `${D.city}, ${D.st}`, shp.dest);
  const limit = Math.min(stopAt, DEMO.asOf);
  return list.filter(e => e.at <= limit && (staleFrom == null || e.at <= staleFrom)).map(e => ({ ...e, received: e.at + ri(4, 38) * 60e3 })).filter(e => e.received <= DEMO.asOf);
}

function finalize(shp, o = {}) {
  const c = CAR[shp.carrier];
  let events = o.events || eventsFor(shp, o);
  if (o.extraEvents) events = events.concat(o.extraEvents.map(e => ({ ...e, received: e.at + 12 * 60e3 }))).sort((a, b) => a.at - b.at);
  // Pieces / PROs: a load may have more than one PRO (split delivery)
  if (o.split) {
    const [aP, bP] = [Math.ceil(shp.pallets / 2), Math.floor(shp.pallets / 2)];
    shp.pros = [
      { pro: c.proPrefix + String(ri(1e7, 9.99e7)), pallets: aP, events: events.slice() },
      { pro: c.proPrefix + String(ri(1e7, 9.99e7)), pallets: bP, events: events.filter(e => e.ms !== 'delivered' && e.ms !== 'out_for_delivery') },
    ];
    const t = events.find(e => e.ms === 'dest_terminal');
    if (o.split === 'ofd' && t) shp.pros[1].events.push({ ms: 'out_for_delivery', at: DEMO.asOf - 3 * H, received: DEMO.asOf - 2.7 * H, raw: `OD - OUT FOR DELIVERY ${LOC[shp.dest].city.toUpperCase()} (SHORT 1 PC - FOLLOWING ON PRO)`, loc: `${LOC[shp.dest].city}, ${LOC[shp.dest].st}`, source: 'Carrier API (demo)' });
  } else {
    shp.pros = [{ pro: c.proPrefix + String(ri(1e7, 9.99e7)), pallets: shp.pallets, events }];
  }
  // Load-level events: union, chronological, with PRO reference retained
  shp.events = shp.pros.flatMap(p => p.events.map(e => ({ ...e, pro: p.pro }))).sort((a, b) => a.at - b.at);
  // Dedupe identical events reported on both PROs (shared linehaul)
  const seen = new Set();
  shp.events = shp.events.filter(e => { const k = e.ms + e.at + e.raw; if (seen.has(k)) return false; seen.add(k); return true; });
  // Normalized status — never upgraded beyond what the carrier reported
  const pieceStatus = p => p.events.length ? p.events[p.events.length - 1].ms : null;
  const ps = shp.pros.map(pieceStatus);
  if (o.cancelled) shp.status = 'cancelled';
  else if (ps.every(s => s === 'delivered')) shp.status = 'delivered';
  else if (ps.some(s => s === 'delivered')) shp.status = 'partial';
  else if (ps.every(s => s == null)) shp.status = (shp.pu.end < DEMO.asOf && o.unknown) ? 'unknown' : 'scheduled';
  else shp.status = ps.filter(Boolean).sort((a, b) => MS_INDEX[a] - MS_INDEX[b])[0];
  const last = shp.events[shp.events.length - 1];
  shp.lastEvent = last || null;
  shp.lastSourceUpdate = last ? last.received : null;
  shp.lastReported = last ? { loc: last.loc, locId: last.locId, at: last.at } : null;
  const dlv = shp.events.filter(e => e.ms === 'delivered');
  shp.deliveredAt = shp.status === 'delivered' ? Math.max(...dlv.map(e => e.at)) : null;
  shp.pickedUpAt = (shp.events.find(e => e.ms === 'picked_up') || {}).at || null;
  // Latest carrier ETA (revised); original dl commitment kept separately
  shp.eta = ['delivered', 'unknown', 'scheduled', 'cancelled'].includes(shp.status) ? null : (o.eta ?? shp._plan.actualDl);
  if (o.etaUnknown) shp.eta = null;
  // Documents (honest availability)
  const pod = shp.status === 'delivered' && !o.noPod && shp.deliveredAt < DEMO.asOf - 5 * H;
  const invoiced = shp.status === 'delivered' && shp.deliveredAt < DEMO.asOf - 2 * 24 * H;
  shp.docs = [
    { type: 'BOL', label: 'Bill of lading', status: 'available', at: shp.pu.start - 20 * H, source: 'Sunnybrook (demo)' },
    { type: 'POD', label: 'Proof of delivery', status: pod ? 'available' : shp.status === 'delivered' ? 'missing' : 'pending', at: pod ? shp.deliveredAt + ri(3, 20) * H : null, source: pod ? 'Carrier image (demo)' : null, note: o.damageNote },
    { type: 'INV', label: 'Customer invoice', status: invoiced ? 'available' : 'pending', at: invoiced ? shp.deliveredAt + 40 * H : null, source: invoiced ? 'Sunnybrook billing (demo)' : null, finance: true },
  ];
  if (o.extraDoc) shp.docs.push(o.extraDoc);
  // Customer charges (authorized customer-facing amounts only — no carrier cost/margin exists in this dataset)
  const cwt = shp.weight / 100;
  const lh = round2(Math.max(168, cwt * (7.5 + shp.miles * 0.019) * (shp.service === 'Volume LTL' ? 0.82 : shp.service === 'Guaranteed LTL' ? 1.32 : 1)));
  const fuel = round2(lh * 0.284);
  const accE = shp.accessorials.reduce((s, a) => s + a.amt, 0);
  shp.charges = { estimate: { linehaul: lh, fuel, accessorials: accE, total: round2(lh + fuel + accE) }, invoice: null };
  if (invoiced) {
    const extra = [];
    if (o.invoiceAdj) extra.push(o.invoiceAdj);
    else if (rnd() < 0.09) extra.push(pick([{ code: 'DET', label: 'Detention at delivery (1.5 h)', amt: 112.5, stage: 'invoice', reason: 'Driver held beyond 2 h free time; receiver-signed time stamps on POD' }, { code: 'LIFT', label: 'Liftgate at delivery (not on BOL)', amt: 85, stage: 'invoice', reason: 'Consignee had no dock available; preventable if requested at booking' }, { code: 'REDL', label: 'Redelivery', amt: 150, stage: 'invoice', reason: 'First attempt refused: no appointment on file' }]));
    shp.accessorials = shp.accessorials.concat(extra);
    const accI = shp.accessorials.reduce((s, a) => s + a.amt, 0);
    const lhI = o.invoiceAdj && o.invoiceAdj.linehaulDelta ? round2(lh + o.invoiceAdj.linehaulDelta) : lh;
    const fuelI = round2(lhI * 0.284);
    shp.charges.invoice = { linehaul: lhI, fuel: fuelI, accessorials: round2(accI - (o.invoiceAdj && o.invoiceAdj.linehaulDelta ? o.invoiceAdj.amt : 0)), total: 0, number: 'INV-D' + (shp.sbLoadId - 300000) };
    shp.charges.invoice.total = round2(shp.charges.invoice.linehaul + shp.charges.invoice.fuel + shp.charges.invoice.accessorials);
  }
  shp.cancelled = !!o.cancelled;
  delete shp._plan;
  return shp;
}

/* ---------- Build the dataset ---------- */
function buildDataset() {
  const ships = [];
  // 1) Bulk history and current freight
  for (let i = 0; i < 160; i++) {
    const lane = pickLane();
    const pd = PICK_DAYS[Math.floor(rnd() * PICK_DAYS.length)];
    const s = makeShipment(lane, pd);
    // keep unscripted freight away from pickup windows that would create unplanned missed-pickup alerts
    if (s.pu.end < DEMO.asOf && s._plan.actualPu > DEMO.asOf) { s._plan.actualPu = s.pu.start + H; s.flags.missedPickup = false; s._plan.actualDl = Math.max(s._plan.actualDl, s.pu.start + 30 * H); }
    const stale = s._plan.actualPu < DEMO.asOf && s._plan.actualDl > DEMO.asOf && rnd() < 0.06 ? DEMO.asOf - ri(26, 40) * H : null;
    ships.push(finalize(s, { staleFrom: stale }));
  }
  // 1b) Extra current freight so the operational views have depth
  const RECENT = ['2026-10-26', '2026-10-27', '2026-10-28', '2026-10-29', '2026-10-29', '2026-10-30', '2026-10-30', '2026-11-02', '2026-11-03'];
  for (let i = 0; i < 34; i++) {
    const s = makeShipment(pickLane(), pick(RECENT), { missedPickup: false });
    if (s.pu.end < DEMO.asOf && s._plan.actualPu > DEMO.asOf) s._plan.actualPu = s.pu.start + H;
    ships.push(finalize(s));
  }
  const L = (o, d) => LANES.find(l => l[0] === o && l[1] === d);
  const scripted = (lane, pd, mk, fin, tag) => { const s = makeShipment(lane, pd, mk); s.scenario = tag; const f = finalize(s, fin); ships.push(f); return f; };

  // 2) Representative scenarios (fixed so the demo walkthrough is reliable)
  scripted(L('F01', 'X01'), '2026-10-27', { carrier: 'C1', delay: 0, pallets: 3 }, {}, 'on-time');
  const missed = scripted(L('F06', 'X07'), '2026-10-29', { carrier: 'C4', missedPickup: true, pallets: 4 }, { events: [] }, 'missed-pickup');
  missed.status = 'scheduled';
  const late = scripted(L('F08', 'X06'), '2026-10-27', { carrier: 'C4', delay: 3, pallets: 5 }, { eta: localMs('2026-11-02', 11, 0, CT), extraEvents: [{ ms: 'in_transit', at: DEMO.asOf - 5 * H, raw: 'SD - SHIPMENT DELAYED LINEHAUL CAPACITY LITTLE ROCK AR NEW ETA 11/02', loc: 'Little Rock, AR', locId: 'T04', source: 'Carrier API (demo)' }] }, 'delivery-delay');
  const stale = scripted(L('F01', 'X03'), '2026-10-26', { carrier: 'C3', delay: 1, pallets: 2 }, { staleFrom: localMs('2026-10-27', 22, 0, ET) }, 'stale-tracking');
  const split = scripted(L('F04', 'X01'), '2026-10-27', { carrier: 'C1', delay: 0, pallets: 6, service: 'Standard LTL' }, { split: 'ofd', stopAt: localMs('2026-10-29', 15, 0, ET2), eta: DEMO.asOf + 3 * H }, 'split-delivery');
  const dmg = scripted(L('F02', 'X08'), '2026-10-22', { carrier: 'C3', delay: 0, pallets: 4 }, { damageNote: 'Consignee noted: 1 pallet crushed corner, 6 cartons damaged' , extraDoc: { type: 'OSD', label: 'Delivery receipt with exceptions', status: 'available', at: localMs('2026-10-23', 15, 0, ET2), source: 'Carrier image (demo)' } }, 'damage');
  const inv = scripted(L('F05', 'X13'), '2026-10-19', { carrier: 'C2', delay: 0, pallets: 5, cls: '70' }, { invoiceAdj: { code: 'RECL', label: 'Reweigh / reclass adjustment (class 70 → 85)', amt: 186.4, stage: 'invoice', linehaulDelta: 186.4, reason: 'Carrier inspection reported 6,140 lb vs 5,480 lb billed; inspection certificate requested' }, extraDoc: { type: 'WI', label: 'Weight & inspection certificate', status: 'missing', at: null, source: null } }, 'invoice-adjustment');
  const nopod = scripted(L('F07', 'X04'), '2026-10-23', { carrier: 'C5', delay: 0, pallets: 2 }, { noPod: true }, 'missing-pod');
  const unk = scripted(L('F03', 'X05'), '2026-10-28', { carrier: 'C2', pallets: 3 }, { events: [], unknown: true }, 'unknown-status');
  const appt = scripted(L('F05', 'F07'), '2026-10-29', { carrier: 'C5', delay: 1, pallets: 6 }, { eta: localMs('2026-11-02', 8, 0, ET2) }, 'appointment');
  // Consolidation candidate: three small loads, same origin and destination, same week
  const c1 = scripted(L('F01', 'F07'), '2026-11-02', { carrier: 'C5', pallets: 3, weight: 2140, service: 'Standard LTL' }, {}, 'consolidation');
  const c2 = scripted(L('F01', 'F07'), '2026-11-02', { carrier: 'C2', pallets: 4, weight: 3010, service: 'Standard LTL' }, {}, 'consolidation');
  const c3 = scripted(L('F01', 'F07'), '2026-11-03', { carrier: 'C5', pallets: 4, weight: 2680, service: 'Standard LTL' }, {}, 'consolidation');
  // Today's pickups and deliveries (ensures the "today" KPIs have substance)
  scripted(L('F02', 'X03'), '2026-10-30', { carrier: 'C3', pallets: 2 }, {}, 'today');
  scripted(L('F08', 'X12'), '2026-10-30', { carrier: 'C4', pallets: 3 }, {}, 'today');
  scripted(L('F01', 'X08'), '2026-10-29', { carrier: 'C1', delay: 0, pallets: 2 }, {}, 'today');
  scripted(L('X09', 'F01'), '2026-10-29', { carrier: 'C1', delay: 0, pallets: 5 }, {}, 'today');
  // A cancelled load: kept for traceability, excluded from KPIs
  scripted(L('F04', 'X02'), '2026-10-20', { carrier: 'C4', pallets: 2 }, { events: [], cancelled: true }, 'cancelled');

  ships.sort((a, b) => a.pu.start - b.pu.start);
  return { ships, scenario: { missed, late, stale, split, dmg, inv, nopod, unk, appt, consolidation: [c1, c2, c3] } };
}

/* ---------- Exception detection (deduplicated by load + type) ---------- */
const EX_TYPES = {
  missed_pickup: 'Missed pickup', late_delivery: 'Late delivery', stalled_tracking: 'Stalled tracking',
  appointment: 'Appointment issue', damage: 'Shortage / damage', missing_pod: 'Missing POD', billing: 'Billing discrepancy',
};
const EX_STATUS = ['new', 'assigned', 'investigating', 'awaiting', 'resolved'];
const EX_STATUS_LABEL = { new: 'New', assigned: 'Assigned', investigating: 'Investigating', awaiting: 'Awaiting carrier/customer', resolved: 'Resolved' };

function detectExceptions(ships, sc) {
  const ex = [];
  const mk = (s, type, sev, detectedAt, source, extra = {}) => {
    const key = s.id + ':' + type; // dedupe key: one exception per load + condition
    const facility = LOC[s.dest].kind === 'facility' && ['late_delivery', 'appointment', 'damage', 'missing_pod'].includes(type) ? s.dest : (LOC[s.origin].kind === 'facility' ? s.origin : s.dest);
    const e = Object.assign({ id: 'EX-' + (5100 + ex.length), key, loadId: s.id, type, severity: sev, facility, detectedAt, source, owner: null, status: 'new', alertCount: 1, nextAction: '', dueAt: detectedAt + 8 * H, resolution: null, resolvedAt: null, history: [] }, extra);
    e.history.unshift({ at: detectedAt, by: 'Control tower', action: 'Detected', detail: `${EX_TYPES[type]} detected from ${source.toLowerCase()}.`, vis: 'customer' });
    ex.push(e); return e;
  };
  const assign = (e, who, at, status = 'assigned') => { e.owner = who; e.status = status; e.history.push({ at, by: 'Dana Whitfield', action: 'Assigned', detail: `Assigned to ${who}.`, vis: 'customer' }); };
  const resolve = (e, at, reason, by = 'Marcus Lee') => { e.status = 'resolved'; e.resolvedAt = at; e.resolution = reason; if (!e.owner) e.owner = by; e.history.push({ at, by, action: 'Resolved', detail: reason, vis: 'customer' }); };

  for (const s of ships) {
    if (s.cancelled) continue;
    // Missed pickup
    if (s.status === 'scheduled' && s.pu.end + 4 * H < DEMO.asOf) {
      const e = mk(s, 'missed_pickup', 'high', s.pu.end + 4 * H, 'Control tower rule: no pickup event 4 h after window');
      e.nextAction = 'Confirm new pickup appointment with carrier'; e.dueAt = DEMO.asOf + 2 * H;
      assign(e, 'Marcus Lee', e.detectedAt + 1.2 * H, 'awaiting');
      e.history.push({ at: e.detectedAt + 2 * H, by: 'Marcus Lee', action: 'Note', detail: 'Carrier dispatch reports driver ran out of hours. Requested recovery pickup Oct 30 PM.', vis: 'customer' });

  otdLate: { label: 'Delivered late in period', fn: s => s.status === 'delivered' && inRangeDate(s.dl.date) && s.deliveredAt > s.dl.end },
  otdBase: { label: 'Delivered, commitment in period', fn: s => s.status === 'delivered' && inRangeDate(s.dl.date) },
};
const STATUS_FILTERS = { all: 'All statuses', open: 'Not delivered', scheduled: 'Scheduled', picked_up: 'Picked up', in_transit: 'In transit', dest_terminal: 'At destination terminal', out_for_delivery: 'Out for delivery', partial: 'Partially delivered', delivered: 'Delivered', unknown: 'Status unknown', cancelled: 'Cancelled' };
const inRangeDate = ds => ds >= F.from && ds <= F.to;

function matchBase(s, opts = {}) {
  if (!opts.ignoreFacility && F.facility !== 'all') {
    if (F.side === 'origin' && s.origin !== F.facility) return false;
    if (F.side === 'dest' && s.dest !== F.facility) return false;
    if (F.side === 'any' && s.origin !== F.facility && s.dest !== F.facility) return false;
  }
  if (!F.dirs.includes(s.direction)) return false;
  if (F.carrier !== 'all' && s.carrier !== F.carrier) return false;
  if (F.status !== 'all') {
    if (F.status === 'open') { if (s.status === 'delivered' || s.cancelled) return false; }
    else if (s.status !== F.status) return false;
  } else if (s.cancelled && !opts.keepCancelled) return false;
  if (!opts.ignoreLane && F.lane && laneKey(s) !== F.lane) return false;
  if (F.search) {
    const q = F.search.toLowerCase().trim();
    const hay = [s.id, String(s.sbLoadId), s.bol, s.po, s.customerRef, ...s.pros.map(p => p.pro), locName(s.origin), locName(s.dest), cityOf(s.origin), cityOf(s.dest), CAR[s.carrier].name, LOC[s.origin].code || '', LOC[s.dest].code || ''].join(' ').toLowerCase();
    if (!q.split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}
const baseList = (opts) => api.shipments().filter(s => matchBase(s, opts));
function tableList() {
  const b = baseList({ keepCancelled: F.status === 'cancelled' });
  if (F.quick && QUICK[F.quick]) return b.filter(QUICK[F.quick].fn);
  if (F.search) return b; // searching spans all dates so a PRO or PO is always findable
  return b.filter(s => inRangeDate(s.pu.date) || isActive(s));
}
function activeFilterChips() {
  const chips = [];
  if (F.facility !== 'all') chips.push(['facility', (F.side === 'origin' ? 'Departing ' : F.side === 'dest' ? 'Arriving ' : 'Facility: ') + locName(F.facility)]);
  if (F.dirs.length < 3) chips.push(['dirs', 'Direction: ' + F.dirs.map(d => d[0].toUpperCase() + d.slice(1)).join(', ')]);
  if (F.carrier !== 'all') chips.push(['carrier', 'Carrier: ' + CAR[F.carrier].name]);
  if (F.status !== 'all') chips.push(['status', 'Status: ' + STATUS_FILTERS[F.status]]);
  if (F.lane) { const [o, d] = F.lane.split('>'); chips.push(['lane', `Lane: ${LOC[o].code || LOC[o].city} → ${LOC[d].code || LOC[d].city}`]); }
  if (F.quick) chips.push(['quick', QUICK[F.quick].label + ' (as of Oct 30, 2:00 PM)']);
  if (F.search) chips.push(['search', 'Search: “' + F.search + '”']);
  if (F.range !== 'period') chips.push(['range', 'Dates: ' + (F.range === 'custom' ? `${fmtD(F.from)} – ${fmtD(F.to)}` : RANGES[F.range].label)]);
  return chips;
}

/* ---------- KPIs ---------- */
function computeKpis(list) {
  const exm = exByLoad();
  const active = list.filter(isActive);
  const puT = list.filter(QUICK.puToday.fn), puDone = puT.filter(s => s.pickedUpAt);
  const dlT = list.filter(QUICK.delToday.fn), dlDone = dlT.filter(s => s.status === 'delivered');
  const openEx = list.flatMap(s => (exm[s.id] || []).filter(exOpen));
  const otdBase = list.filter(QUICK.otdBase.fn), otdOn = otdBase.filter(s => s.deliveredAt <= s.dl.end);
  const spendList = list.filter(s => inRangeDate(s.pu.date) && !s.cancelled);
  const inv = spendList.filter(s => s.charges && s.charges.invoice).reduce((a, s) => a + s.charges.invoice.total, 0);
  const est = spendList.filter(s => s.charges && !s.charges.invoice).reduce((a, s) => a + s.charges.estimate.total, 0);
  return { active, puT, puDone, dlT, dlDone, openEx, otdBase, otdOn, spendList, inv, est, high: openEx.filter(e => e.severity === 'high') };
}

  const otd = pct(k.otdOn.length, k.otdBase.length);

    ${cell('Open exceptions', k.openEx.length, `${k.high.length} high severity`, 'data-act="goto" data-page="exceptions"', '', k.high.length ? 'red-text' : '')}
    ${cell('On-time delivery', otd == null ? '—' : otd.toFixed(1) + '%', `${k.otdOn.length} of ${k.otdBase.length} delivered loads`, 'data-act="quick" data-q="otdBase"', '', otd != null && otd < 90 ? 'amber-text' : 'teal-text')}
    ${r.charges ? cell('Freight spend', money(k.inv + k.est), `${money(k.inv)} invoiced · ${money(k.est)} est.`, 'data-act="goto" data-page="insights"') : cell('Freight spend', '<span style="font-size:14px">Not authorized</span>', 'Charges hidden for this role', 'data-act="defs"')}

/* ---------- Exceptions ---------- */
const EX_TABS = { open: 'Open', new: 'New', assigned: 'Assigned', investigating: 'Investigating', awaiting: 'Awaiting', resolved: 'Resolved', all: 'All' };
function exceptionList() {
  const ids = new Set(baseList({ keepCancelled: true }).map(s => s.id));
  return api.exceptions().filter(e => ids.has(e.loadId))
    .filter(e => UI.exTab === 'all' || (UI.exTab === 'open' ? exOpen(e) : e.status === UI.exTab))
    .filter(e => UI.exType === 'all' || e.type === UI.exType)
    .filter(e => UI.exSev === 'all' || e.severity === UI.exSev);
}
function exceptionsPage() {
  const all = api.exceptions().filter(e => new Set(baseList({ keepCancelled: true }).map(s => s.id)).has(e.loadId));
  const rows = exceptionList();
  const sevRank = { high: 0, medium: 1, low: 2 };
  rows.sort((a, b) => (exOpen(b) - exOpen(a)) || sevRank[a.severity] - sevRank[b.severity] || a.detectedAt - b.detectedAt);
  const open = all.filter(exOpen), resolved = all.filter(e => !exOpen(e));
  const avgRes = resolved.length ? resolved.reduce((a, e) => a + (e.resolvedAt - e.detectedAt), 0) / resolved.length : null;
  const overdue = open.filter(e => e.dueAt < DEMO.asOf);
  const alerts = all.reduce((a, e) => a + e.alertCount, 0);
  return `<div class="page-head"><div><div class="eyebrow">Exceptions</div><h1>Exception management</h1><p>One exception per load and condition: repeated alerts are merged. Delays and missing tracking are separate conditions. Resolving an exception records the outcome here; it never changes the carrier status in Sunnybrook.</p></div></div>
  <div class="snapshot" style="grid-template-columns:repeat(5,minmax(0,1fr))">
    <button class="snapshot-cell" data-act="ex-tab" data-v="open"><span>Open</span><strong>${open.length}</strong><small>${open.filter(e => e.severity === 'high').length} high · ${open.filter(e => !e.owner).length} unassigned</small></button>
    <button class="snapshot-cell" data-act="ex-tab" data-v="new"><span>New</span><strong>${open.filter(e => e.status === 'new').length}</strong><small>awaiting first review</small></button>
    <button class="snapshot-cell" data-act="ex-tab" data-v="awaiting"><span>Awaiting carrier/customer</span><strong>${open.filter(e => e.status === 'awaiting').length}</strong><small>external response needed</small></button>
    <div class="snapshot-cell"><span>Past due next action</span><strong class="${overdue.length ? 'amber-text' : ''}">${overdue.length}</strong><small>due time has passed</small></div>
    <div class="snapshot-cell"><span>Avg. time to resolve</span><strong>${avgRes == null ? '—' : dur(avgRes)}</strong><small>${resolved.length} resolved · ${alerts} raw alerts → ${all.length} exceptions</small></div>
  </div>
  <section class="card" style="margin-top:16px">
    <div class="toolbar"><div class="views" role="group" aria-label="Status">${Object.entries(EX_TABS).map(([k, v]) => `<button class="tab" data-act="ex-tab" data-v="${k}" aria-pressed="${UI.exTab === k}">${v}</button>`).join('')}</div>
      <select class="select" aria-label="Exception type" data-change="ex-type"><option value="all">All types</option>${Object.entries(EX_TYPES).map(([k, v]) => `<option value="${k}" ${UI.exType === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <select class="select" aria-label="Severity" data-change="ex-sev"><option value="all">All severities</option>${['high', 'medium', 'low'].map(k => `<option value="${k}" ${UI.exSev === k ? 'selected' : ''}>${k[0].toUpperCase() + k.slice(1)}</option>`).join('')}</select>
      <span class="tiny muted">Global facility, direction, carrier and search filters also apply.</span></div>
    <div class="table-wrap"><table><caption class="sr-only">Exceptions</caption><thead><tr><th>Severity</th><th>Exception</th><th>Load</th><th>Facility</th><th>Owner</th><th>Status</th><th>Next action</th><th class="num">Age</th></tr></thead><tbody>
    ${rows.length ? rows.map(e => `<tr class="clickable" data-act="open-ex" data-id="${e.id}"><td><span class="sev ${e.severity}"><i></i>${e.severity}</span></td><td><button class="linkish" data-act="open-ex" data-id="${e.id}">${EX_TYPES[e.type]}</button><small>${e.id}${e.alertCount > 1 ? ` · ${e.alertCount} alerts merged` : ''}</small></td><td><span class="table-id">${e.loadId}</span><small>${esc(e.source)}</small></td><td>${esc(locName(e.facility))}</td><td>${e.owner ? esc(e.owner) : '<span class="amber-text" style="font-weight:600">Unassigned</span>'}</td><td>${exStatusBadge(e)}</td><td>${e.status === 'resolved' ? `<span class="muted">${esc(e.resolution)}</span>` : `${esc(e.nextAction || 'Review and assign')}<small class="${e.dueAt < DEMO.asOf ? 'red-text' : ''}">due ${fmtDT(e.dueAt)}${e.dueAt < DEMO.asOf ? ' · past due' : ''}</small>`}</td><td class="num nowrap">${dur((e.resolvedAt || DEMO.asOf) - e.detectedAt)}</td></tr>`).join('') : `<tr><td colspan="8"><div class="empty"><strong>No exceptions</strong>Nothing matches these filters.</div></td></tr>`}
    </tbody></table></div>
  </section>`;
}
function exStatusBadge(e) { const m = { new: 'red', assigned: 'blue', investigating: 'blue', awaiting: 'amber', resolved: 'teal' }; return `<span class="badge ${m[e.status]}">${EX_STATUS_LABEL[e.status]}</span>`; }

'use strict';

function barRows(items, { fmt = v => money(v), color = 'var(--navy3)', sub } = {}) {
  const max = Math.max(1, ...items.map(i => i.v));
  return items.map(i => `<div class="bar-row"><span class="lbl" title="${esc(i.label)}">${esc(i.label)}</span><span class="track" role="img" aria-label="${esc(i.label)}: ${esc(fmt(i.v))}"><span style="width:${(i.v / max * 100).toFixed(1)}%;background:${i.color || color}"></span></span><span class="val">${fmt(i.v)}${sub ? `<small class="muted" style="display:block;font-size:10.5px">${sub(i)}</small>` : ''}</span></div>`).join('');
}
function weeklyChart(list) {
  // Weeks starting Monday, by pickup date; invoiced vs estimated stacked
  const weeks = [];
  for (let d = '2026-08-31'; d <= DEMO.periodEnd; d = addDays(d, 7)) weeks.push(d);
  const data = weeks.map(w => { const e = addDays(w, 6); const ss = list.filter(s => s.pu.date >= w && s.pu.date <= e); return { w, inv: ss.filter(s => s.charges.invoice).reduce((a, s) => a + s.charges.invoice.total, 0), est: ss.filter(s => !s.charges.invoice).reduce((a, s) => a + s.charges.estimate.total, 0), n: ss.length }; }).filter(x => x.w <= F.to && addDays(x.w, 6) >= F.from);
  if (!data.length) return '<div class="empty">No data in range</div>';
  const W = 640, Hh = 210, pl = 54, pb = 28, max = Math.max(1, ...data.map(d => d.inv + d.est));
  const step = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / step) * step;
  const bw = (W - pl - 10) / data.length;
  const y = v => (Hh - pb) - v / top * (Hh - pb - 10);
  const ticks = [0, top / 2, top].map(t => `<line x1="${pl}" x2="${W - 6}" y1="${y(t)}" y2="${y(t)}" stroke="#ECEFF3"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end" font-size="10.5" fill="#627083">${money(t)}</text>`).join('');
  const bars = data.map((d, i) => { const x = pl + i * bw + bw * 0.18, w = bw * 0.64; return `<g><title>Week of ${fmtD(d.w)}: ${money(d.inv)} invoiced, ${money(d.est)} estimated, ${d.n} loads</title><rect x="${x}" y="${y(d.inv)}" width="${w}" height="${(Hh - pb) - y(d.inv)}" fill="#1C3A62" rx="2"/><rect x="${x}" y="${y(d.inv + d.est)}" width="${w}" height="${y(d.inv) - y(d.inv + d.est)}" fill="#BCD84A" rx="2"/>${i % 2 === 0 ? `<text x="${x + w / 2}" y="${Hh - 10}" text-anchor="middle" font-size="10" fill="#627083">${fmtD(d.w)}</text>` : ''}</g>`; }).join('');
  return `<div class="stack-legend"><span><i style="background:#1C3A62"></i>Invoiced</span><span><i style="background:#BCD84A"></i>Estimated (not yet invoiced)</span></div><svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Weekly customer freight spend, invoiced and estimated">${ticks}${bars}</svg>`;
}
function insightsPage() {
  const r = role();

  const delivered = list.filter(s => s.status === 'delivered');

  const head = `<div class="page-head"><div><div class="eyebrow">Insights</div><h1>Spend and service</h1><p>Customer-facing reporting for ${esc(F.range === 'custom' ? fmtD(F.from) + ' – ' + fmtD(F.to) : RANGES[F.range].label)}. Every rate shows its sample size. Charges are what Northfield is billed — carrier buy rates, BHD margin and commissions are never part of these reports.</p></div><button class="btn" data-act="defs">${ic('info')}KPI definitions</button></div>`;

    const transit = d.length ? d.reduce((a, s) => a + (s.deliveredAt - s.pickedUpAt), 0) / d.length / (24 * H) : null;
    return { c, n: ss.length, d, on, pb, pon, ex, claims: ex.filter(e => e.type === 'damage').length, pod, podOk, transit, spend: ss.reduce((a, s) => a + chargeTotal(s), 0) };
  }).filter(x => x.n);

  const byType = Object.keys(EX_TYPES).map(t => { const rs = resolved.filter(e => e.type === t); const op = allEx.filter(e => e.type === t && exOpen(e)); return { t, n: allEx.filter(e => e.type === t).length, open: op.length, avg: rs.length ? rs.reduce((a, e) => a + e.resolvedAt - e.detectedAt, 0) / rs.length : null, rs: rs.length }; }).filter(x => x.n);
  const claims = allEx.filter(e => e.type === 'damage');
  const service = `

  </tbody></table></div><p class="kpi-def" style="margin:0 14px 12px">Transit = first pickup event to final delivery event, calendar days. Exceptions include resolved ones. Different carriers serve different lanes, so compare a carrier on the same lane before acting on a gap.</p></section>
  <section class="card" style="margin-top:14px"><div class="panel-head"><h2>Exception resolution by type</h2><small>exceptions on loads in the period</small></div>
  <div class="table-wrap"><table><thead><tr><th>Type</th><th class="num">Total</th><th class="num">Open</th><th class="num">Resolved</th><th class="num">Avg time to resolve</th></tr></thead><tbody>${byType.map(x => `<tr><td>${EX_TYPES[x.t]}</td><td class="num">${x.n}</td><td class="num">${x.open}</td><td class="num">${x.rs}</td><td class="num">${x.avg == null ? '—' : dur(x.avg)}</td></tr>`).join('')}</tbody></table></div></section>`;

  if (!r.charges) return head + `<div class="banner amber">${ic('lock')}<div><b>Spend reporting is not available for this role.</b> Customer charges are excluded from this user's data entirely — in production the server omits them from responses, aggregates and exports.</div></div>` + service;

  // ----- Spend
  const inv = list.filter(s => s.charges.invoice), est = list.filter(s => !s.charges.invoice);
  const invT = inv.reduce((a, s) => a + s.charges.invoice.total, 0), estT = est.reduce((a, s) => a + s.charges.estimate.total, 0);
  const total = invT + estT, wt = list.reduce((a, s) => a + s.weight, 0);
  const lineSum = k => inv.reduce((a, s) => a + s.charges.invoice[k], 0) + est.reduce((a, s) => a + s.charges.estimate[k], 0);
  const byFac = api.facilities().map(f => ({ label: `${f.code} · ${f.name}`, v: list.filter(s => facilityOfShipment(s) === f.id).reduce((a, s) => a + chargeTotal(s), 0), n: list.filter(s => facilityOfShipment(s) === f.id).length })).sort((a, b) => b.v - a.v);
  const byCar = carriers.map(x => ({ label: x.c.name, v: x.spend, n: x.n })).sort((a, b) => b.v - a.v);
  const laneM = {}; for (const s of list) { const a = laneM[laneKey(s)] ||= { k: laneKey(s), o: s.origin, d: s.dest, n: 0, v: 0, wt: 0, mi: s.miles }; a.n++; a.v += chargeTotal(s); a.wt += s.weight; }
  const lanes = Object.values(laneM).sort((a, b) => b.v - a.v).slice(0, 10);
  // Accessorials: count each line once, from the invoice when invoiced, else the booking
  const accM = {};
  for (const s of list) for (const a of s.accessorials) { if (a.stage === 'invoice' && !s.charges.invoice) continue; if (a.code === 'RECL') continue; const x = accM[a.code] ||= { code: a.code, label: a.label.replace(/ \(.*\)/, ''), n: 0, v: 0, invoiceAdded: 0, reasons: new Set() }; x.n++; x.v += a.amt; if (a.stage === 'invoice') { x.invoiceAdded++; if (a.reason) x.reasons.add(a.reason); } }
  const ACC_EXPL = { APPT: 'Requested at booking for receivers that require appointments. Expected; not preventable.', LIFT: 'Needed when the receiver has no dock. Booking it up front avoids an unplanned charge at delivery.', INSD: 'Requested at booking for inside placement.', DET: 'Driver held past free time at the receiver. Usually preventable with on-time appointments and dock readiness.', REDL: 'Second delivery attempt after a refusal or missed appointment. Preventable.' };
  const variance = inv.map(s => ({ s, d: s.charges.invoice.total - s.charges.estimate.total })).filter(x => Math.abs(x.d) > 0.5).sort((a, b) => b.d - a.d);
  const spend = `
  <h2 class="sec-h">Customer freight spend <span class="note-inline">· by pickup date · invoiced where available, otherwise estimate</span></h2>
  <div class="snapshot">
    <div class="snapshot-cell"><span>Total spend</span><strong>${money(total)}</strong><small>${list.length} loads</small></div>
    <div class="snapshot-cell"><span>Invoiced</span><strong>${money(invT)}</strong><small>${inv.length} invoices</small></div>
    <div class="snapshot-cell"><span>Estimated</span><strong>${money(estT)}</strong><small>${est.length} not yet invoiced</small></div>
    <div class="snapshot-cell"><span>Cost per load</span><strong>${list.length ? money(total / list.length) : '—'}</strong><small>all services and distances</small></div>
    <div class="snapshot-cell"><span>Cost per cwt</span><strong>${wt ? money(total / (wt / 100), 2) : '—'}</strong><small>${nf.format(Math.round(wt / 100))} cwt billed weight</small></div>
    <div class="snapshot-cell"><span>Charge mix</span><strong style="font-size:14px">${pctTxt(lineSum('linehaul'), total)} linehaul</strong><small>${pctTxt(lineSum('fuel'), total)} fuel · ${pctTxt(lineSum('accessorials'), total)} accessorials</small></div>
  </div>
  <div class="grid2" style="margin-top:14px">
    <section class="card pad"><h2 style="margin-bottom:10px">Spend by week</h2>${weeklyChart(list)}</section>
    <section class="card pad"><h2 style="margin-bottom:8px">Spend by facility</h2>${barRows(byFac, { sub: i => i.n + ' loads' })}<p class="kpi-def">Attributed to the shipping facility; supplier inbound is attributed to the receiving facility.</p></section>
  </div>
  <div class="grid2" style="margin-top:14px">
    <section class="card pad"><h2 style="margin-bottom:8px">Spend by carrier</h2>${barRows(byCar, { color: '#0B1F3A', sub: i => i.n + ' loads' })}</section>
    <section class="card"><div class="panel-head"><h2>Top lanes by spend</h2><small>per cwt shown only when weight is present</small></div><div class="table-wrap"><table><thead><tr><th>Lane</th><th class="num">Loads</th><th class="num">Miles</th><th class="num">Spend</th><th class="num">Per load</th><th class="num">Per cwt</th></tr></thead><tbody>${lanes.map(l => `<tr class="clickable" data-act="lane-go" data-key="${l.k}"><td><div class="route-chips"><b>${esc(LOC[l.o].code || LOC[l.o].city)}</b><span class="arrow">→</span><b>${esc(LOC[l.d].code || LOC[l.d].city)}</b></div></td><td class="num">${l.n}</td><td class="num">${nf.format(l.mi)}</td><td class="num">${money(l.v)}</td><td class="num">${money(l.v / l.n)}</td><td class="num">${l.wt ? money(l.v / (l.wt / 100), 2) : '—'}</td></tr>`).join('')}</tbody></table></div></section>
  </div>
  <div class="grid2" style="margin-top:14px">
    <section class="card"><div class="panel-head"><h2>Accessorials</h2><small>each charge counted once · fuel shown separately above</small></div><div class="table-wrap"><table><thead><tr><th>Accessorial</th><th class="num">Count</th><th class="num">Amount</th><th class="num">Added at invoice</th><th>Explanation</th></tr></thead><tbody>${Object.values(accM).sort((a, b) => b.v - a.v).map(a => `<tr><td>${esc(a.label)}</td><td class="num">${a.n}</td><td class="num">${money(a.v)}</td><td class="num ${a.invoiceAdded ? 'amber-text' : ''}">${a.invoiceAdded}</td><td class="tiny">${esc(ACC_EXPL[a.code] || '')}</td></tr>`).join('') || '<tr><td colspan="5"><div class="empty">No accessorials</div></td></tr>'}</tbody></table></div></section>
    <section class="card"><div class="panel-head"><h2>Expected vs. invoiced</h2><small>${inv.length} invoiced loads · ${variance.length} with a difference</small></div>
      <div class="pad" style="padding-bottom:6px"><div class="details" style="grid-template-columns:repeat(3,1fr)"><div><span>Expected (estimate)</span><strong>${money(inv.reduce((a, s) => a + s.charges.estimate.total, 0), 2)}</strong></div><div><span>Invoiced</span><strong>${money(invT, 2)}</strong></div><div><span>Difference</span><strong class="${invT - inv.reduce((a, s) => a + s.charges.estimate.total, 0) > 0 ? 'amber-text' : ''}">${money(invT - inv.reduce((a, s) => a + s.charges.estimate.total, 0), 2)}</strong></div></div></div>
      <div class="table-wrap" style="max-height:260px"><table><thead><tr><th>Load</th><th class="num">Expected</th><th class="num">Invoiced</th><th class="num">Diff.</th><th>Reason</th></tr></thead><tbody>${variance.map(x => `<tr class="clickable" data-act="open-ship" data-id="${x.s.id}"><td class="table-id">${x.s.id}</td><td class="num">${money(x.s.charges.estimate.total, 2)}</td><td class="num">${money(x.s.charges.invoice.total, 2)}</td><td class="num amber-text">${money(x.d, 2)}</td><td class="tiny">${esc((x.s.accessorials.find(a => a.stage === 'invoice') || {}).label || '')}</td></tr>`).join('') || '<tr><td colspan="5"><div class="empty">Every invoice matched its estimate</div></td></tr>'}</tbody></table></div></section>
  </div>`;
  return head + spend + service;
}

/* ---------- Opportunities ---------- */
function computeOpportunities() {
  const r = role();
  const all = baseList();
  const period = all.filter(s => inRangeDate(s.pu.date) && !s.cancelled);
  const opps = [];
  const est = s => s.charges ? s.charges.estimate.total : null;
  // 1) Consolidation: same origin + destination, pickups within 2 business days, combined ≤ 12 pallets, not yet picked up
  const sched = all.filter(s => s.status === 'scheduled' && s.pu.end > DEMO.asOf);
  const groups = {}; for (const s of sched) (groups[laneKey(s)] ||= []).push(s);
  for (const [k, ss] of Object.entries(groups)) {
    if (ss.length < 2) continue;
    ss.sort((a, b) => a.pu.start - b.pu.start);
    const span = (ss[ss.length - 1].pu.start - ss[0].pu.start) / (24 * H);
    const pal = ss.reduce((a, s) => a + s.pallets, 0), wt = ss.reduce((a, s) => a + s.weight, 0);
    if (span > 3 || pal > 14) continue;
    const cur = ss.reduce((a, s) => a + (est(s) || 0), 0);
    opps.push({ id: 'OPP-CON-' + k, type: 'Consolidation', title: `Consolidate ${ss.length} loads ${LOC[ss[0].origin].code} → ${LOC[ss[0].dest].code || LOC[ss[0].dest].city}`, ships: ss, est: r.charges ? cur * 0.27 : null, cur: r.charges ? cur : null,
      summary: `${ss.length} scheduled LTL loads on the same lane, pickups within ${Math.max(1, Math.round(span))} days, ${pal} pallets and ${nf.format(wt)} lb combined.`,
      assumptions: [`Ready dates allow one pickup on ${fmtDW(ss[0].pu.date)} or a hold to ${fmtDW(ss[ss.length - 1].pu.date)} (not confirmed)`, 'Combined delivery fits one appointment window at the receiver (not confirmed)', `${pal} pallets fit a single volume-LTL or partial shipment; dimensions from the BOLs, stackability ${ss.every(s => s.handling === 'Stackable') ? 'reported as stackable' : 'mixed — at least one load is do-not-stack'}`, 'Handling compatibility of the products is unverified', 'Savings use a historical consolidation ratio, not a current quote'],
      action: 'BHD reviews ready dates and current pricing with the shipping facility, then proposes one volume quote. Nothing is rebooked from this screen.',
      service: 'Earliest load may ship up to one day later; receiver gets one delivery instead of several.', owner: 'Sam Okafor (BHD Account Manager)' });
  }
  // 2) Volume LTL candidates
  const vol = period.filter(s => s.service === 'Standard LTL' && (s.pallets >= 6 || s.weight >= 5000));
  if (vol.length) { const cur = vol.reduce((a, s) => a + (est(s) || 0), 0); opps.push({ id: 'OPP-VOL', type: 'Volume LTL', title: `${vol.length} large loads moved as standard LTL`, ships: vol, est: r.charges ? cur * 0.12 : null, cur: r.charges ? cur : null,
    summary: `Loads of 6+ pallets or 5,000+ lb were priced as standard LTL in the period.`, assumptions: ['Volume quotes are available on these lanes at similar transit (requires current pricing)', 'Typical volume-LTL discount of ~12% applied for the estimate', 'Freight dimensions on the BOL are accurate'], action: 'BHD requests volume quotes automatically for loads above 6 pallets on these lanes, subject to customer approval.', service: 'Volume LTL can add a day of transit on some lanes; fewer handling touches may reduce damage.', owner: 'Sam Okafor (BHD Account Manager)' }); }
  // 3) Pool distribution: many outbound loads from one facility into one region
  const REG = { TX: 'Texas', GA: 'Southeast', NC: 'Southeast', AL: 'Southeast', MI: 'Great Lakes', OH: 'Great Lakes', PA: 'Great Lakes', IA: 'Plains', AR: 'Plains', TN: 'Mid-South' };
  const pool = {}; for (const s of period.filter(s => s.direction === 'outbound')) { const reg = REG[LOC[s.dest].st]; if (!reg) continue; const k = s.origin + '|' + reg; (pool[k] ||= []).push(s); }
  Object.entries(pool).filter(([, ss]) => new Set(ss.map(s => s.dest)).size >= 2 && ss.length >= 8 && ss.reduce((a, s) => a + s.pallets, 0) / ss.length <= 5).sort((a, b) => b[1].length - a[1].length).slice(0, 2).forEach(([k, ss]) => {
    const [o, reg] = k.split('|'); const cur = ss.reduce((a, s) => a + (est(s) || 0), 0);
    opps.push({ id: 'OPP-POOL-' + k, type: 'Pool distribution', title: `Pool ${LOC[o].code} freight into the ${reg} region`, ships: ss, est: r.charges ? cur * 0.15 : null, cur: r.charges ? cur : null,
      summary: `${ss.length} small outbound loads from ${LOC[o].name} to ${new Set(ss.map(s => s.dest)).size} ${reg} receivers in the period.`, assumptions: ['A pool point or cross-dock is available near the receivers (not evaluated)', 'Order cut-offs allow a weekly or twice-weekly ship day', '~15% savings assumed from historical pool programs; requires current pricing'], action: 'BHD models a scheduled pool program and reviews ship-day changes with the facility.', service: 'Fixed ship days may add 1–2 days for some orders but make delivery days predictable.', owner: 'Sam Okafor (BHD Account Manager)' });
  });
  // 4) Repeated lane service problems
  const laneS = {}; for (const s of all.filter(QUICK.otdBase.fn)) { const a = laneS[laneKey(s)] ||= { k: laneKey(s), ships: [], on: 0 }; a.ships.push(s); if (s.deliveredAt <= s.dl.end) a.on++; }
  Object.values(laneS).filter(a => a.ships.length >= 4 && a.on / a.ships.length < 0.8).sort((a, b) => a.on / a.ships.length - b.on / b.ships.length).slice(0, 2).forEach(a => {
    const [o, d] = a.k.split('>'); const cars = [...new Set(a.ships.map(s => CAR[s.carrier].name))];
    opps.push({ id: 'OPP-LANE-' + a.k, type: 'Lane improvement', title: `Improve service ${LOC[o].code || LOC[o].city} → ${LOC[d].code || LOC[d].city}`, ships: a.ships, est: null, cur: null,
      summary: `On-time delivery ${Math.round(a.on / a.ships.length * 100)}% (${a.on} of ${a.ships.length}) in the period. Carriers used: ${cars.join(', ')}.`, assumptions: ['Late deliveries are measured against original commitments', 'Root cause (carrier, transit standard or appointment) not yet confirmed'], action: 'BHD reviews late loads with the carrier, checks whether the published transit standard fits the commitment, and proposes a carrier or commitment change.', service: 'Goal is service, not cost: savings are not estimated.', owner: 'Dana Whitfield (BHD Operations)' });
  });
  // 5) Preventable accessorials
  const prev = period.filter(s => s.accessorials.some(a => a.stage === 'invoice' && ['DET', 'LIFT', 'REDL'].includes(a.code)));
  if (prev.length) { const amt = r.charges ? prev.reduce((a, s) => a + s.accessorials.filter(x => x.stage === 'invoice' && ['DET', 'LIFT', 'REDL'].includes(x.code)).reduce((b, x) => b + x.amt, 0), 0) : null;
    opps.push({ id: 'OPP-ACC', type: 'Preventable accessorials', title: `${prev.length} loads with preventable accessorials`, ships: prev, est: amt, cur: amt, summary: 'Detention, unplanned liftgate and redelivery charges added at invoice.', assumptions: ['Charges were avoidable with correct booking details or appointments (verify per load)', 'Estimate equals charges incurred in the period; future savings depend on behavior change'], action: 'BHD updates receiver profiles (liftgate, appointment rules) and flags these consignees at booking.', service: 'No service impact; fewer refused or held deliveries.', owner: 'Priya Natarajan (BHD Claims & Billing)' }); }
  return opps;
}
function opportunitiesPage() {

}

function resolutionReasons(t) {
  const common = ['Resolved with carrier', 'Customer confirmed — no further action', 'Duplicate of another exception', 'False alert — data corrected'];
